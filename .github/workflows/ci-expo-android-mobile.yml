name: CI / Expo Android mobile — native build

on:
  workflow_call:
    inputs:
      cache_access:
        description: Cache access for the validation run
        type: string
        default: auto
      cli_version:
        description: Optional exact CLI canary release
        type: string
        default: ''

permissions:
  contents: read
  id-token: write

env:
  GO_VERSION: "1.27.0"
  NODE_VERSION: "22.23.2"

jobs:
  run:
    name: Expo Android mobile — native build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Record source and runner identity
        shell: bash
        run: |
          git rev-parse HEAD
          cat .github/boringcache-upstream
          git status --short
          lscpu
          sha256sum go.sum Cargo.lock rust-toolchain.toml web/pnpm-lock.yaml
      - uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: temurin
          java-version: "21.0.12+1"
      - uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699 # v4.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "22.23.2"
      - run: corepack enable
      - name: Install native cache tools
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL https://github.com/ccache/ccache/releases/download/v4.14/ccache-4.14-linux-x86_64-glibc.tar.gz -o "$RUNNER_TEMP/ccache.tar.gz"
          echo "c64760b0b85ba86068f4cd162dc42e2dc39c6f46b0cb8c1990dfccbec7a1fed0  $RUNNER_TEMP/ccache.tar.gz" | sha256sum --check -
          tar -xzf "$RUNNER_TEMP/ccache.tar.gz" -C "$RUNNER_TEMP"
          sudo install -m 755 "$RUNNER_TEMP/ccache-4.14-linux-x86_64-glibc/ccache" /usr/local/bin/ccache
          curl -fsSL https://github.com/ccache/ccache-storage-http-go/releases/download/v0.9/ccache-storage-http-go-0.9-linux-amd64.tar.gz -o "$RUNNER_TEMP/ccache-http.tar.gz"
          echo "875dbf6d575d06e4c4492f1ba639beb68530bc23382031a6bacc767cded9f463  $RUNNER_TEMP/ccache-http.tar.gz" | sha256sum --check -
          tar -xzf "$RUNNER_TEMP/ccache-http.tar.gz" -C "$RUNNER_TEMP"
          sudo install -m 755 "$RUNNER_TEMP/ccache-storage-http-go-0.9-linux-amd64/ccache-storage-http" /usr/local/bin/ccache-storage-http
          ccache --version
          ccache-storage-http --version
          {
            echo 'CCACHE_COMPILERCHECK=content'
            echo 'CCACHE_SLOPPINESS='
            echo 'CMAKE_C_COMPILER_LAUNCHER=ccache'
            echo 'CMAKE_CXX_COMPILER_LAUNCHER=ccache'
          } >> "$GITHUB_ENV"
      - uses: boringcache/one@404b744a2053da4cf963f13f615f7fafe94f3cf7 # v1.30.1
        with:
          cli-version: ${{ inputs.cli_version }}
          mode: archive
          cache-profiles: android
          trust-policy: ${{ (github.event_name == 'pull_request' || github.event_name == 'merge_group' || inputs.cache_access == 'restore') && 'restore' || 'auto' }}
          fail-on-cache-error: true
      - uses: boringcache/one@404b744a2053da4cf963f13f615f7fafe94f3cf7 # v1.30.1
        with:
          cli-version: ${{ inputs.cli_version }}
          mode: gradle
          trust-policy: ${{ (github.event_name == 'pull_request' || github.event_name == 'merge_group' || inputs.cache_access == 'restore') && 'restore' || 'auto' }}
          fail-on-cache-error: true
      - uses: boringcache/one@404b744a2053da4cf963f13f615f7fafe94f3cf7 # v1.30.1
        with:
          cli-version: ${{ inputs.cli_version }}
          mode: ccache
          trust-policy: ${{ (github.event_name == 'pull_request' || github.event_name == 'merge_group' || inputs.cache_access == 'restore') && 'restore' || 'auto' }}
          fail-on-cache-error: true
      - run: make fe-install
      - name: Generate and build the standalone mobile APK
        run: make client-android-debug CLIENT_APP=mobile
      - name: Keep the standalone mobile APK
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: expo-android-mobile
          path: web/apps/mobile/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
