name: CI / Go — repository contracts

on:
  workflow_call:
    inputs:
      cache_access:
        description: Cache access for the validation run
        type: string
        default: auto
      cli_version:
        description: Optional exact CLI canary release
        type: string
        default: ''

permissions:
  contents: read
  id-token: write

env:
  GO_VERSION: "1.27.0"
  NODE_VERSION: "22.23.2"

jobs:
  run:
    name: Go — repository contracts
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Record source and runner identity
        shell: bash
        run: |
          git rev-parse HEAD
          cat .github/boringcache-upstream
          git status --short
          lscpu
          sha256sum go.sum Cargo.lock rust-toolchain.toml web/pnpm-lock.yaml
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: false
      - name: BoringCache archive
        uses: boringcache/one@404b744a2053da4cf963f13f615f7fafe94f3cf7 # v1.30.1
        with:
          cli-version: ${{ inputs.cli_version }}
          mode: archive
          cache-profiles: go-contracts
          trust-policy: ${{ (github.event_name == 'pull_request' || github.event_name == 'merge_group' || inputs.cache_access == 'restore') && 'restore' || 'auto' }}
          fail-on-cache-error: true
      - name: BoringCache go
        uses: boringcache/one@404b744a2053da4cf963f13f615f7fafe94f3cf7 # v1.30.1
        with:
          cli-version: ${{ inputs.cli_version }}
          mode: go
          trust-policy: ${{ (github.event_name == 'pull_request' || github.event_name == 'merge_group' || inputs.cache_access == 'restore') && 'restore' || 'auto' }}
          fail-on-cache-error: true
      - name: Static analysis and repository contracts
        run: make fmt shellcheck privacy-verify vet tags-verify vet-tags lint agent-harness-test compose-verify release-verify go-race-verify
      - name: The test shards cover every package
        run: make go-shard-verify SHARDS=3
      - name: OpenAPI spec is committed and current
        run: make openapi-verify
      - name: Config docs are committed and current
        run: make config-docs-verify
      - name: The §2 package map is committed and current
        run: make arch-docs-verify
      - name: Command reference is committed and current
        run: make dev-docs-verify
      - name: Retired identifiers are gone from prose
        run: make retired-verify
      - name: Workflows are valid
        run: make ci-lint
      - name: Observability artifacts are provisionable
        run: make observability-verify
