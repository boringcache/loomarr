name: BoringCache validation
run-name: BoringCache ${{ inputs.phase || 'connect' }} at ${{ github.ref_name }}

on:
  workflow_dispatch:
    inputs:
      phase:
        description: Connect once, then seed, warm or validate each upstream commit
        type: choice
        options: [connect, seed, warm, rolling]
        default: rolling
      cli_version:
        description: Optional exact BoringCache CLI release or prerelease
        type: string
        default: ''

permissions:
  contents: read
  id-token: write

concurrency:
  group: boringcache-validation-${{ github.ref }}
  cancel-in-progress: false

env:
  GO_VERSION: "1.27.0"
  NODE_VERSION: "22.23.2"

jobs:
  connect:
    if: github.repository == 'boringcache/loomarr' && inputs.phase == 'connect'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Install the released CLI for enrollment
        run: |
          curl -fsSL https://install.boringcache.com/install.sh | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Connect the fork with GitHub OIDC
        run: boringcache ci connect --oidc-provider github-actions

  cache_go:
    if: github.repository == 'boringcache/loomarr' && github.event_name == 'workflow_dispatch' && inputs.phase != 'connect'
    name: Go — race-policy tests (${{ matrix.shard }}/${{ strategy.job-total }})
    runs-on: ubuntu-24.04
    # This job is test-only. Repository-wide contracts run once in `go-contracts`, in parallel;
    # repeating Rust, lint, vet, harness, cross-compilation, and release checks in every shard spent
    # runner time and inflated each shard's cache without adding assurance.
    #
    # THREE shards, not two. Re-measured 2026-08-18: the per-package -race suite is ~381s but is
    # dominated by a few packages (internal/app alone is ~125s), so round-robin balance depends on
    # the split COUNT. Modelled critical path (slowest shard): 2 shards = 237s, 3 = 185s, 4 = 215s
    # — 4 REGRESSES because round-robin happens to pile app+store+integration onto one shard. 3 is
    # the measured sweet spot (−22% vs 2). The real floor is internal/app at ~125s, one unsplittable
    # package; sharding cannot beat it — that needs the per-test SQLite-setup sharing the `test`
    # target's note describes, tracked separately.
    #
    # -race is also SCOPED (scripts/go-race-policy.sh): a short, verified opt-out set of
    # concurrency-free config/table-test packages runs without the detector. `make go-race-verify`
    # keeps that list honest; it is fail-safe (race stays ON for anything not explicitly opted out).
    #
    # ⚠ Sharding is the one change here that can quietly SHRINK the gate — a split that drops
    # a package leaves those tests unrun and every shard green. `make go-shard-verify` below
    # is the guard, and it is not optional.
    #
    strategy:
      fail-fast: false # one shard's failures must not hide the others'
      matrix:
        shard: [1, 2, 3]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Record source and runner identity
        shell: bash
        run: |
          git rev-parse HEAD
          cat .github/boringcache-upstream
          git status --short
          lscpu
          sha256sum go.sum Cargo.lock rust-toolchain.toml web/pnpm-lock.yaml
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: false
      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.93.0 --profile minimal
      - uses: taiki-e/install-action@c44f6b046f1c29ae5918b1e0bfdbb2f1813836fd # v2.84.1
        with:
          tool: sccache@0.17.0
      - uses: boringcache/one@404b744a2053da4cf963f13f615f7fafe94f3cf7 # v1.30.1
        with:
          cli-version: ${{ inputs.cli_version }}
          mode: archive
          cache-profiles: cargo-dependencies
          trust-policy: ${{ (github.event_name == 'pull_request' || github.event_name == 'merge_group' || inputs.phase == 'warm') && 'restore' || 'auto' }}
          fail-on-cache-error: true
      - name: Use the Cargo adapter in Make targets
        shell: bash
        env:
          CACHE_ACCESS: ${{ (github.event_name == 'pull_request' || github.event_name == 'merge_group' || inputs.phase == 'warm') && 'restore' || 'auto' }}
        run: |
          if [[ "$CACHE_ACCESS" == restore ]]; then
            echo 'CARGO=boringcache cargo --read-only' >> "$GITHUB_ENV"
          else
            echo 'CARGO=boringcache cargo --write' >> "$GITHUB_ENV"
          fi
      - name: BoringCache Go dependencies and FFmpeg
        uses: boringcache/one@404b744a2053da4cf963f13f615f7fafe94f3cf7 # v1.30.1
        with:
          cli-version: ${{ inputs.cli_version }}
          mode: archive
          cache-profiles: go
          trust-policy: ${{ (github.event_name == 'pull_request' || github.event_name == 'merge_group' || inputs.phase == 'warm') && 'restore' || 'auto' }}
          fail-on-cache-error: true
      - name: BoringCache go
        uses: boringcache/one@404b744a2053da4cf963f13f615f7fafe94f3cf7 # v1.30.1
        with:
          cli-version: ${{ inputs.cli_version }}
          mode: go
          trust-policy: ${{ (github.event_name == 'pull_request' || github.event_name == 'merge_group' || inputs.phase == 'warm') && 'restore' || 'auto' }}
          fail-on-cache-error: true
      # Exercise the deployed media toolchain. Distribution FFmpeg versions have different
      # MPEG-TS startup latency; both executables must match the production image's pins.
      # Cache the immutable archive by digest and verify every hit before extraction.
      - name: Resolve production FFmpeg pin
        id: ffmpeg-pin
        run: ./scripts/ci-ffmpeg.sh metadata >> "$GITHUB_OUTPUT"
      - name: Download production FFmpeg
        run: ./scripts/ci-ffmpeg.sh download "$HOME/.cache/loomarr-ffmpeg"
      - name: Install production FFmpeg
        run: |
          ./scripts/ci-ffmpeg.sh install "$HOME/.cache/loomarr-ffmpeg" "$RUNNER_TEMP/loomarr-ffmpeg"
          echo "$RUNNER_TEMP/loomarr-ffmpeg" >> "$GITHUB_PATH"
      - name: Verify production FFmpeg on PATH
        run: |
          test "$(command -v ffmpeg)" = "$RUNNER_TEMP/loomarr-ffmpeg/ffmpeg"
          test "$(command -v ffprobe)" = "$RUNNER_TEMP/loomarr-ffmpeg/ffprobe"
          ffmpeg -version
          ffprobe -version
      - run: make test GO_SHARD=${{ matrix.shard }}/${{ strategy.job-total }}
        # Independent synthetic targets otherwise compete for the same worker
        # while asserting strict media latency. Retain race and shard coverage.
        env:
          GOFLAGS: -p=1

  cache_go_contracts:
    if: github.repository == 'boringcache/loomarr' && github.event_name == 'workflow_dispatch' && inputs.phase != 'connect'
    name: Go — repository contracts
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Record source and runner identity
        shell: bash
        run: |
          git rev-parse HEAD
          cat .github/boringcache-upstream
          git status --short
          lscpu
          sha256sum go.sum Cargo.lock rust-toolchain.toml web/pnpm-lock.yaml
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: false
      - name: BoringCache archive
        uses: boringcache/one@404b744a2053da4cf963f13f615f7fafe94f3cf7 # v1.30.1
        with:
          cli-version: ${{ inputs.cli_version }}
          mode: archive
          cache-profiles: go-contracts
          trust-policy: ${{ (github.event_name == 'pull_request' || github.event_name == 'merge_group' || inputs.phase == 'warm') && 'restore' || 'auto' }}
          fail-on-cache-error: true
      - name: Static analysis and repository contracts
        run: make fmt shellcheck privacy-verify vet tags-verify vet-tags lint agent-harness-test compose-verify release-verify go-race-verify
      - name: The test shards cover every package
        run: make go-shard-verify SHARDS=3
      - name: OpenAPI spec is committed and current
        run: make openapi-verify
      - name: Config docs are committed and current
        run: make config-docs-verify
      - name: The §2 package map is committed and current
        run: make arch-docs-verify
      - name: Command reference is committed and current
        run: make dev-docs-verify
      - name: Retired identifiers are gone from prose
        run: make retired-verify
      - name: Workflows are valid
        run: make ci-lint
      - name: Observability artifacts are provisionable
        run: make observability-verify

  cache_rust_contracts:
    if: github.repository == 'boringcache/loomarr' && github.event_name == 'workflow_dispatch' && inputs.phase != 'connect'
    name: Rust — repository contracts
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Record source and runner identity
        shell: bash
        run: |
          git rev-parse HEAD
          cat .github/boringcache-upstream
          git status --short
          lscpu
          sha256sum go.sum Cargo.lock rust-toolchain.toml web/pnpm-lock.yaml
      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.93.0 --profile minimal
      - uses: taiki-e/install-action@c44f6b046f1c29ae5918b1e0bfdbb2f1813836fd # v2.84.1
        with:
          tool: sccache@0.17.0
      - uses: boringcache/one@404b744a2053da4cf963f13f615f7fafe94f3cf7 # v1.30.1
        with:
          cli-version: ${{ inputs.cli_version }}
          mode: archive
          cache-profiles: cargo-dependencies
          trust-policy: ${{ (github.event_name == 'pull_request' || github.event_name == 'merge_group' || inputs.phase == 'warm') && 'restore' || 'auto' }}
          fail-on-cache-error: true
      - name: Use the Cargo adapter in Make targets
        shell: bash
        env:
          CACHE_ACCESS: ${{ (github.event_name == 'pull_request' || github.event_name == 'merge_group' || inputs.phase == 'warm') && 'restore' || 'auto' }}
        run: |
          if [[ "$CACHE_ACCESS" == restore ]]; then
            echo 'CARGO=boringcache cargo --read-only' >> "$GITHUB_ENV"
          else
            echo 'CARGO=boringcache cargo --write' >> "$GITHUB_ENV"
          fi
      - run: make rust-check

  cache_image_certification:
    if: github.repository == 'boringcache/loomarr' && github.event_name == 'workflow_dispatch' && inputs.phase != 'connect'
    name: Rust image — runtime certification
    runs-on: ubuntu-24.04
    # Certification is independent of static repository contracts. It used to start only after
    # `check-static` finished, adding a measured two minutes to the critical path even though the
    # two gates share no result. Keep it required through `ci-ok`, but run it in parallel.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Record source and runner identity
        shell: bash
        run: |
          git rev-parse HEAD
          cat .github/boringcache-upstream
          git status --short
          lscpu
          sha256sum go.sum Cargo.lock rust-toolchain.toml web/pnpm-lock.yaml
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: false
      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.93.0 --profile minimal
      - uses: taiki-e/install-action@c44f6b046f1c29ae5918b1e0bfdbb2f1813836fd # v2.84.1
        with:
          tool: sccache@0.17.0
      - uses: boringcache/one@404b744a2053da4cf963f13f615f7fafe94f3cf7 # v1.30.1
        with:
          cli-version: ${{ inputs.cli_version }}
          mode: archive
          cache-profiles: cargo-dependencies
          trust-policy: ${{ (github.event_name == 'pull_request' || github.event_name == 'merge_group' || inputs.phase == 'warm') && 'restore' || 'auto' }}
          fail-on-cache-error: true
      - name: Use the Cargo adapter in Make targets
        shell: bash
        env:
          CACHE_ACCESS: ${{ (github.event_name == 'pull_request' || github.event_name == 'merge_group' || inputs.phase == 'warm') && 'restore' || 'auto' }}
        run: |
          if [[ "$CACHE_ACCESS" == restore ]]; then
            echo 'CARGO=boringcache cargo --read-only' >> "$GITHUB_ENV"
          else
            echo 'CARGO=boringcache cargo --write' >> "$GITHUB_ENV"
          fi
      - name: BoringCache go
        uses: boringcache/one@404b744a2053da4cf963f13f615f7fafe94f3cf7 # v1.30.1
        with:
          cli-version: ${{ inputs.cli_version }}
          mode: go
          trust-policy: ${{ (github.event_name == 'pull_request' || github.event_name == 'merge_group' || inputs.phase == 'warm') && 'restore' || 'auto' }}
          fail-on-cache-error: true
      - name: Certify the release worker against the deterministic real-codec corpus
        run: IMAGE_CERT_REPORT="$RUNNER_TEMP/image-certification.json" make image-cert
      - name: Keep the Rust image certification report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: rust-image-certification
          path: ${{ runner.temp }}/image-certification.json
          if-no-files-found: ignore
          retention-days: 14

  cache_android:
    if: github.repository == 'boringcache/loomarr' && github.event_name == 'workflow_dispatch' && inputs.phase != 'connect'
    name: Android TV — React Native Play bundle
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Record source and runner identity
        shell: bash
        run: |
          git rev-parse HEAD
          cat .github/boringcache-upstream
          git status --short
          lscpu
          sha256sum go.sum Cargo.lock rust-toolchain.toml web/pnpm-lock.yaml
      - uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: temurin
          java-version: "21.0.12+1"
      - uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699 # v4.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "22.23.2"
      - run: corepack enable
      - name: Install native cache tools
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL https://github.com/ccache/ccache/releases/download/v4.14/ccache-4.14-linux-x86_64-glibc.tar.gz -o "$RUNNER_TEMP/ccache.tar.gz"
          echo "c64760b0b85ba86068f4cd162dc42e2dc39c6f46b0cb8c1990dfccbec7a1fed0  $RUNNER_TEMP/ccache.tar.gz" | sha256sum --check -
          tar -xzf "$RUNNER_TEMP/ccache.tar.gz" -C "$RUNNER_TEMP"
          sudo install -m 755 "$RUNNER_TEMP/ccache-4.14-linux-x86_64-glibc/ccache" /usr/local/bin/ccache
          curl -fsSL https://github.com/ccache/ccache-storage-http-go/releases/download/v0.9/ccache-storage-http-go-0.9-linux-amd64.tar.gz -o "$RUNNER_TEMP/ccache-http.tar.gz"
          echo "875dbf6d575d06e4c4492f1ba639beb68530bc23382031a6bacc767cded9f463  $RUNNER_TEMP/ccache-http.tar.gz" | sha256sum --check -
          tar -xzf "$RUNNER_TEMP/ccache-http.tar.gz" -C "$RUNNER_TEMP"
          sudo install -m 755 "$RUNNER_TEMP/ccache-storage-http-go-0.9-linux-amd64/ccache-storage-http" /usr/local/bin/ccache-storage-http
          ccache --version
          test -x /usr/local/bin/ccache-storage-http
          {
            echo 'CCACHE_COMPILERCHECK=content'
            echo 'CCACHE_SLOPPINESS='
            echo 'CMAKE_C_COMPILER_LAUNCHER=ccache'
            echo 'CMAKE_CXX_COMPILER_LAUNCHER=ccache'
          } >> "$GITHUB_ENV"
      - uses: boringcache/one@404b744a2053da4cf963f13f615f7fafe94f3cf7 # v1.30.1
        with:
          cli-version: ${{ inputs.cli_version }}
          mode: archive
          cache-profiles: android
          trust-policy: ${{ (github.event_name == 'pull_request' || github.event_name == 'merge_group' || inputs.phase == 'warm') && 'restore' || 'auto' }}
          fail-on-cache-error: true
      - uses: boringcache/one@404b744a2053da4cf963f13f615f7fafe94f3cf7 # v1.30.1
        with:
          cli-version: ${{ inputs.cli_version }}
          mode: gradle
          trust-policy: ${{ (github.event_name == 'pull_request' || github.event_name == 'merge_group' || inputs.phase == 'warm') && 'restore' || 'auto' }}
          fail-on-cache-error: true
      - uses: boringcache/one@404b744a2053da4cf963f13f615f7fafe94f3cf7 # v1.30.1
        with:
          cli-version: ${{ inputs.cli_version }}
          mode: ccache
          trust-policy: ${{ (github.event_name == 'pull_request' || github.event_name == 'merge_group' || inputs.phase == 'warm') && 'restore' || 'auto' }}
          fail-on-cache-error: true
      - run: make fe-install
      - run: make fe-codegen
      - name: Build and profile the verified four-ABI bundle
        id: android
        run: make android-profile
        env:
          ANDROID_CI_OUTPUT_DIR: ${{ github.workspace }}/.artifacts/android-ci
      - name: Retain the exact unsigned merge-result bundle
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: loomarr-android-unsigned-${{ github.sha }}
          path: .artifacts/android-ci/*
          if-no-files-found: error
          retention-days: 30
      - name: Retain Android build diagnostics separately from promotion artifacts
        if: ${{ always() && steps.android.outcome != 'skipped' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: loomarr-android-profile-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: .artifacts/android-build-profile/
          if-no-files-found: error
          retention-days: 30

  cache_expo_android_mobile:
    if: github.repository == 'boringcache/loomarr' && github.event_name == 'workflow_dispatch' && inputs.phase != 'connect'
    name: Expo Android mobile — native build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Record source and runner identity
        shell: bash
        run: |
          git rev-parse HEAD
          cat .github/boringcache-upstream
          git status --short
          lscpu
          sha256sum go.sum Cargo.lock rust-toolchain.toml web/pnpm-lock.yaml
      - uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: temurin
          java-version: "21.0.12+1"
      - uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699 # v4.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "22.23.2"
      - run: corepack enable
      - name: Install native cache tools
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL https://github.com/ccache/ccache/releases/download/v4.14/ccache-4.14-linux-x86_64-glibc.tar.gz -o "$RUNNER_TEMP/ccache.tar.gz"
          echo "c64760b0b85ba86068f4cd162dc42e2dc39c6f46b0cb8c1990dfccbec7a1fed0  $RUNNER_TEMP/ccache.tar.gz" | sha256sum --check -
          tar -xzf "$RUNNER_TEMP/ccache.tar.gz" -C "$RUNNER_TEMP"
          sudo install -m 755 "$RUNNER_TEMP/ccache-4.14-linux-x86_64-glibc/ccache" /usr/local/bin/ccache
          curl -fsSL https://github.com/ccache/ccache-storage-http-go/releases/download/v0.9/ccache-storage-http-go-0.9-linux-amd64.tar.gz -o "$RUNNER_TEMP/ccache-http.tar.gz"
          echo "875dbf6d575d06e4c4492f1ba639beb68530bc23382031a6bacc767cded9f463  $RUNNER_TEMP/ccache-http.tar.gz" | sha256sum --check -
          tar -xzf "$RUNNER_TEMP/ccache-http.tar.gz" -C "$RUNNER_TEMP"
          sudo install -m 755 "$RUNNER_TEMP/ccache-storage-http-go-0.9-linux-amd64/ccache-storage-http" /usr/local/bin/ccache-storage-http
          ccache --version
          test -x /usr/local/bin/ccache-storage-http
          {
            echo 'CCACHE_COMPILERCHECK=content'
            echo 'CCACHE_SLOPPINESS='
            echo 'CMAKE_C_COMPILER_LAUNCHER=ccache'
            echo 'CMAKE_CXX_COMPILER_LAUNCHER=ccache'
          } >> "$GITHUB_ENV"
      - uses: boringcache/one@404b744a2053da4cf963f13f615f7fafe94f3cf7 # v1.30.1
        with:
          cli-version: ${{ inputs.cli_version }}
          mode: archive
          cache-profiles: android
          trust-policy: ${{ (github.event_name == 'pull_request' || github.event_name == 'merge_group' || inputs.phase == 'warm') && 'restore' || 'auto' }}
          fail-on-cache-error: true
      - uses: boringcache/one@404b744a2053da4cf963f13f615f7fafe94f3cf7 # v1.30.1
        with:
          cli-version: ${{ inputs.cli_version }}
          mode: gradle
          trust-policy: ${{ (github.event_name == 'pull_request' || github.event_name == 'merge_group' || inputs.phase == 'warm') && 'restore' || 'auto' }}
          fail-on-cache-error: true
      - uses: boringcache/one@404b744a2053da4cf963f13f615f7fafe94f3cf7 # v1.30.1
        with:
          cli-version: ${{ inputs.cli_version }}
          mode: ccache
          trust-policy: ${{ (github.event_name == 'pull_request' || github.event_name == 'merge_group' || inputs.phase == 'warm') && 'restore' || 'auto' }}
          fail-on-cache-error: true
      - run: make fe-install
      - name: Generate and build the standalone mobile APK
        run: make client-android-debug CLIENT_APP=mobile
      - name: Keep the standalone mobile APK
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: expo-android-mobile
          path: web/apps/mobile/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7

  cache_image:
    if: github.repository == 'boringcache/loomarr' && github.event_name == 'workflow_dispatch' && inputs.phase != 'connect'
    name: Image — release build (${{ matrix.platform }})
    runs-on: ${{ matrix.runner }}
    # Build each release architecture on a native four-core runner. The old combined amd64
    # job emulated arm64 through QEMU and spent ~30 minutes compiling the Rust worker; GitHub's
    # standard arm64 runner makes the same architecture proof without emulation. Keep this a
    # matrix so the two complete images build in parallel and one architecture cannot answer
    # for the other.
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-24.04
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
    # Still cap either native build. GitHub's default is six hours; 45 minutes leaves ample
    # headroom for a completely cold Docker build without allowing a hung download to run all day.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Record source and runner identity
        shell: bash
        run: |
          git rev-parse HEAD
          cat .github/boringcache-upstream
          git status --short
          lscpu
          sha256sum go.sum Cargo.lock rust-toolchain.toml web/pnpm-lock.yaml
      - name: BoringCache docker
        uses: boringcache/one@404b744a2053da4cf963f13f615f7fafe94f3cf7 # v1.30.1
        with:
          cli-version: ${{ inputs.cli_version }}
          mode: docker
          trust-policy: ${{ (github.event_name == 'pull_request' || github.event_name == 'merge_group' || inputs.phase == 'warm') && 'restore' || 'auto' }}
          fail-on-cache-error: true

      - name: Inspect packaged license and notice metadata
        shell: bash
        run: |
          set -euo pipefail
          image=loomarr-ci:verify
          test "$(docker image inspect "$image" --format '{{ index .Config.Labels "org.opencontainers.image.documentation" }}')" = \
            "https://github.com/loomarr/loomarr/blob/main/THIRD_PARTY_NOTICES.md"
          test "$(docker image inspect "$image" --format '{{ index .Config.Labels "org.opencontainers.image.licenses" }}')" = \
            "MIT AND GPL-3.0-or-later"
          container=$(docker create "$image")
          trap 'docker rm -f "$container" >/dev/null' EXIT
          docker cp "$container:/usr/share/doc/loomarr/LICENSE" "$RUNNER_TEMP/LICENSE"
          docker cp "$container:/usr/share/doc/loomarr/THIRD_PARTY_NOTICES.md" "$RUNNER_TEMP/THIRD_PARTY_NOTICES.md"
          cmp LICENSE "$RUNNER_TEMP/LICENSE"
          cmp THIRD_PARTY_NOTICES.md "$RUNNER_TEMP/THIRD_PARTY_NOTICES.md"

  cache_frontend:
    if: github.repository == 'boringcache/loomarr' && github.event_name == 'workflow_dispatch' && inputs.phase != 'connect'
    name: Frontend — biome + typecheck + unit + build (${{ matrix.shard }}/${{ strategy.job-total }})
    runs-on: ubuntu-24.04
    # `make fe` was 394s and this job 7.0 min. The jsdom unit suite is the bulk of it ON THIS
    # RUNNER, which is the part worth spelling out: locally the whole suite is 33.5s (measured
    # 2026-08-09, 1307 tests over 166 files), and every other stage is small — biome 1.9s,
    # typecheck 3.6s, vite build 5.0s, storybook 10.3s. What makes it the bulk here is cores.
    # vitest is the most parallelism-hungry stage in the chain, and a 4-core runner is roughly
    # a sixth of the dev box it was measured on, so it degrades far more than the rest.
    #
    # Everything except the unit tests re-runs in both shards. That is the same trade as the Go
    # job: parallel, so it costs no wall clock, and it keeps CI running the same `make fe` a
    # developer runs rather than a bespoke decomposition of it.
    strategy:
      fail-fast: false # one shard's failures must not hide the others'
      matrix:
        shard: [1, 2]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Record source and runner identity
        shell: bash
        run: |
          git rev-parse HEAD
          cat .github/boringcache-upstream
          git status --short
          lscpu
          sha256sum go.sum Cargo.lock rust-toolchain.toml web/pnpm-lock.yaml
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Enable pnpm (pinned via web/package.json packageManager)
        run: corepack enable
      - name: BoringCache archive
        uses: boringcache/one@404b744a2053da4cf963f13f615f7fafe94f3cf7 # v1.30.1
        with:
          cli-version: ${{ inputs.cli_version }}
          mode: archive
          cache-profiles: frontend
          trust-policy: ${{ (github.event_name == 'pull_request' || github.event_name == 'merge_group' || inputs.phase == 'warm') && 'restore' || 'auto' }}
          fail-on-cache-error: true
      - run: make fe-install
      - run: make fe FE_SHARD=${{ matrix.shard }}/${{ strategy.job-total }}
      # Whole-repo and shard-independent — diffing the same generated token artifacts in every
      # shard would prove the same thing N times. Shard 1, matching the drift checks in the Go
      # job and e2e in the Playwright job.
      - name: Token artifacts are committed and current
        if: matrix.shard == 1
        run: make fe-tokens-verify
