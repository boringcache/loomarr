name: CI / Rust image — runtime certification

on:
  workflow_call:
    inputs:
      cache_access:
        description: Cache access for the validation run
        type: string
        default: auto
      cli_version:
        description: Optional exact CLI canary release
        type: string
        default: ''

permissions:
  contents: read
  id-token: write

env:
  GO_VERSION: "1.27.0"
  NODE_VERSION: "22.23.2"

jobs:
  run:
    name: Rust image — runtime certification
    runs-on: ubuntu-24.04
    # Certification is independent of static repository contracts. It used to start only after
    # `check-static` finished, adding a measured two minutes to the critical path even though the
    # two gates share no result. Keep it required through `ci-ok`, but run it in parallel.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Record source and runner identity
        shell: bash
        run: |
          git rev-parse HEAD
          cat .github/boringcache-upstream
          git status --short
          lscpu
          sha256sum go.sum Cargo.lock rust-toolchain.toml web/pnpm-lock.yaml
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: false
      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.93.0 --profile minimal
      - uses: taiki-e/install-action@c44f6b046f1c29ae5918b1e0bfdbb2f1813836fd # v2.84.1
        with:
          tool: sccache@0.17.0
      - uses: boringcache/one@404b744a2053da4cf963f13f615f7fafe94f3cf7 # v1.30.1
        with:
          cli-version: ${{ inputs.cli_version }}
          mode: archive
          cache-profiles: cargo-dependencies
          trust-policy: ${{ (github.event_name == 'pull_request' || github.event_name == 'merge_group' || inputs.cache_access == 'restore') && 'restore' || 'auto' }}
          fail-on-cache-error: true
      - name: Use the Cargo adapter in Make targets
        shell: bash
        env:
          CACHE_ACCESS: ${{ (github.event_name == 'pull_request' || github.event_name == 'merge_group' || inputs.cache_access == 'restore') && 'restore' || 'auto' }}
        run: |
          if [[ "$CACHE_ACCESS" == restore ]]; then
            echo 'CARGO=boringcache cargo --read-only' >> "$GITHUB_ENV"
          else
            echo 'CARGO=boringcache cargo --write' >> "$GITHUB_ENV"
          fi
      - name: BoringCache go
        uses: boringcache/one@404b744a2053da4cf963f13f615f7fafe94f3cf7 # v1.30.1
        with:
          cli-version: ${{ inputs.cli_version }}
          mode: go
          trust-policy: ${{ (github.event_name == 'pull_request' || github.event_name == 'merge_group' || inputs.cache_access == 'restore') && 'restore' || 'auto' }}
          fail-on-cache-error: true
      - name: Certify the release worker against the deterministic real-codec corpus
        run: IMAGE_CERT_REPORT="$RUNNER_TEMP/image-certification.json" make image-cert
      - name: Keep the Rust image certification report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: rust-image-certification
          path: ${{ runner.temp }}/image-certification.json
          if-no-files-found: ignore
          retention-days: 14
