name: CI / Rust — repository contracts

on:
  workflow_call:
    inputs:
      cache_access:
        description: Cache access for the validation run
        type: string
        default: auto
      cli_version:
        description: Optional exact CLI canary release
        type: string
        default: ''

permissions:
  contents: read
  id-token: write

env:
  GO_VERSION: "1.27.0"
  NODE_VERSION: "22.23.2"

jobs:
  run:
    name: Rust — repository contracts
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Record source and runner identity
        shell: bash
        run: |
          git rev-parse HEAD
          cat .github/boringcache-upstream
          git status --short
          lscpu
          sha256sum go.sum Cargo.lock rust-toolchain.toml web/pnpm-lock.yaml
      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.93.0 --profile minimal
      - uses: taiki-e/install-action@c44f6b046f1c29ae5918b1e0bfdbb2f1813836fd # v2.84.1
        with:
          tool: sccache@0.17.0
      - uses: boringcache/one@404b744a2053da4cf963f13f615f7fafe94f3cf7 # v1.30.1
        with:
          cli-version: ${{ inputs.cli_version }}
          mode: archive
          cache-profiles: cargo-dependencies
          trust-policy: ${{ (github.event_name == 'pull_request' || github.event_name == 'merge_group' || inputs.cache_access == 'restore') && 'restore' || 'auto' }}
          fail-on-cache-error: true
      - name: Use the Cargo adapter in Make targets
        shell: bash
        env:
          CACHE_ACCESS: ${{ (github.event_name == 'pull_request' || github.event_name == 'merge_group' || inputs.cache_access == 'restore') && 'restore' || 'auto' }}
        run: |
          if [[ "$CACHE_ACCESS" == restore ]]; then
            echo 'CARGO=boringcache cargo --read-only' >> "$GITHUB_ENV"
          else
            echo 'CARGO=boringcache cargo --write' >> "$GITHUB_ENV"
          fi
      - run: make rust-check
